<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Project</title>

    <!-- Bootstrap and CSS -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body style="background-color: #f5f5f5; color: #333333;">
    <div class="container mt-5 p-4" style="background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h2 class="text-center p-3" style="background-color: #e3f2fd; color: #0d47a1; border-radius: 8px;">CRUD Project In Ajax (Django)</h2>
        <div class="row">
            <div class="col-sm-4">
                <h4 class="text-center p-2" style="background-color: #e3f2fd; color: #0d47a1; border-radius: 8px;">Add/Update Details</h4>
                <form id="editForm">
                    <label for="name" style="color: #0d47a1;">Username</label>
                    <input type="text" name="username" id="name" class="form-control mb-3" style="border: 1px solid #dddddd;">
                    
                    <label for="age" style="color: #0d47a1;">Age</label>
                    <input type="number" name="age" id="age" class="form-control mb-3" style="border: 1px solid #dddddd;">
                    
                    <label for="email" style="color: #0d47a1;">Email ID</label>
                    <input type="email" name="email" id="email" class="form-control mb-3" style="border: 1px solid #dddddd;">
                    
                    <input type="hidden" id="itemId" name="itemId">

                    <button class="btn btn-primary mr-2" onclick="add()" type="button" style="background-color: #1976d2; border-color: #1976d2;">Add</button>
                    <button class="btn btn-secondary" onclick="updateItem()" type="button" style="background-color: #6c757d; border-color: #6c757d;">Update</button>
                </form>
            </div>
            <div class="col-sm-8">
                <h4 class="text-center p-2" style="background-color: #e3f2fd; color: #0d47a1; border-radius: 8px;">Show Details</h4>
                <table class="table table-hover" style="background-color: #ffffff; border: 1px solid #dddddd;">
                    <thead style="background-color: #e3f2fd; color: #0d47a1;">
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Age</th>
                            <th scope="col">Email</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody id="itemsBody" style="color: #333333;">
                        <!-- Items will be dynamically added here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            loadItems();
        });

        function loadItems() {
            $.ajax({
                url: "{% url 'get_items' %}",
                success: function(data) {
                    $('#itemsBody').empty();
                    $.each(data, function(index, item) {
                        $('#itemsBody').append('<tr><td>' + item.name + '</td><td>' + item.age + '</td><td>' + item.email + '</td><td><button class="btn btn-warning btn-sm mr-2" onclick="edit(' + item.id + ')">Edit</button><button class="btn btn-danger btn-sm" onclick="deleteItem(' + item.id + ')">Delete</button></td></tr>');
                    });
                }
            });
        }

        function add() {
            var name = $('#name').val();
            var age = $('#age').val();
            var email = $('#email').val();
            $.ajax({
                type: 'POST',
                url: "{% url 'add_item' %}",
                data: {
                    'name': name,
                    'age': age,
                    'email': email,
                    csrfmiddlewaretoken: '{{ csrf_token }}'
                },
                success: function() {
                    loadItems();
                    $('#name').val('');
                    $('#age').val('');
                    $('#email').val('');
                }
            });
        }

        function edit(itemId) {
            $.ajax({
                type: 'GET',
                url: "{% url 'edit_item' %}?id=" + itemId,
                success: function(data) {
                    $('#editForm #name').val(data.name);
                    $('#editForm #age').val(data.age);
                    $('#editForm #email').val(data.email);
                    $('#editForm #itemId').val(itemId);
                }
            });
        }

        function updateItem() {
            var name = $('#name').val();
            var age = $('#age').val();
            var email = $('#email').val();
            var itemId = $('#itemId').val();
            $.ajax({
                type: 'POST',
                url: "{% url 'update_item' %}",
                data: {
                    'id': itemId,
                    'name': name,
                    'age': age,
                    'email': email,
                    csrfmiddlewaretoken: '{{ csrf_token }}'
                },
                success: function(response) {
                    if (response.success) {
                        loadItems();
                        $('#name').val('');
                        $('#age').val('');
                        $('#email').val('');
                    }
                }
            });
        }

        function deleteItem(itemId) {
            if (confirm("Are you sure you want to delete this item?")) {
                $.ajax({
                    type: 'POST',
                    url: "{% url 'delete_item' %}",
                    data: {
                        'id': itemId,
                        csrfmiddlewaretoken: '{{ csrf_token }}'
                    },
                    success: function(response) {
                        if (response.success) {
                            loadItems();
                        }
                    }
                });
            }
        }
    </script>
</body>
</html>
